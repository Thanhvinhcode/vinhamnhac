
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;
  --accent:#7c6aff;--accent2:#a78bfa;
  --text:#f0f0f8;--text2:#9090b0;--text3:#6060a0;
  --border:#2a2a3a;--green:#4ade80;--red:#f87171;
}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* PAGES */
#page-player,#page-admin{display:none;min-height:100vh;}
#page-player.active,#page-admin.active{display:flex;flex-direction:column;}

/* ========== PLAYER PAGE ========== */
#player-wrap{
  display:flex;flex-direction:column;align-items:center;
  padding:24px 20px 100px;min-height:100vh;
  background:linear-gradient(180deg,#0e0e1a 0%,#0a0a0f 100%);
}

/* Album Art */
#album-art{
  width:220px;height:220px;border-radius:50%;
  background:var(--bg3);border:3px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  margin:20px 0 28px;
  position:relative;overflow:hidden;flex-shrink:0;
  transition:box-shadow 0.5s;
}
#album-art.playing{
  animation:spin 8s linear infinite;
  box-shadow:0 0 0 4px var(--accent),0 0 40px rgba(124,106,255,0.4);
}
@keyframes spin{to{transform:rotate(360deg);}}
#album-art svg{width:80px;height:80px;opacity:0.3;}
#album-canvas{position:absolute;inset:0;border-radius:50%;}
#album-center{
  position:absolute;width:50px;height:50px;border-radius:50%;
  background:var(--bg);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;z-index:2;
}
#album-center-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}

/* Song Info */
#song-title{font-size:22px;font-weight:700;color:var(--text);text-align:center;margin-bottom:6px;max-width:320px;line-height:1.3;}
#song-artist{font-size:16px;color:var(--text2);text-align:center;margin-bottom:24px;}

/* Progress */
#progress-wrap{width:100%;max-width:340px;margin-bottom:8px;}
#progress-bar-bg{
  height:5px;background:var(--bg3);border-radius:10px;
  cursor:pointer;position:relative;overflow:hidden;
}
#progress-bar-fill{height:100%;width:0%;background:var(--accent);border-radius:10px;transition:width 0.3s;}
#progress-input{
  position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;
  -webkit-appearance:none;appearance:none;
}
#time-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-top:6px;max-width:340px;width:100%;}

/* Controls */
#controls{display:flex;align-items:center;gap:20px;margin:20px 0;}
.ctrl-btn{
  background:none;border:none;color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;padding:10px;transition:all 0.2s;
}
.ctrl-btn:hover{color:var(--text);background:var(--bg3);}
.ctrl-btn.active{color:var(--accent);}
#btn-play{
  width:64px;height:64px;border-radius:50%;
  background:var(--accent);color:white;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
#btn-play:hover{background:var(--accent2);transform:scale(1.05);}
#btn-play:active{transform:scale(0.95);}

/* Volume */
#vol-row{display:flex;align-items:center;gap:10px;width:100%;max-width:280px;margin-top:4px;}
#vol-row svg{color:var(--text3);flex-shrink:0;}
#vol-slider{
  flex:1;-webkit-appearance:none;appearance:none;height:4px;
  background:var(--bg3);border-radius:10px;cursor:pointer;outline:none;
}
#vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);cursor:pointer;
}

/* Playlist */
#playlist-section{width:100%;max-width:380px;margin-top:28px;}
#playlist-label{font-size:12px;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px;}
#playlist{display:flex;flex-direction:column;gap:4px;}
.playlist-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-radius:12px;cursor:pointer;transition:all 0.2s;
  border:1px solid transparent;
}
.playlist-item:hover{background:var(--bg2);}
.playlist-item.active{background:rgba(124,106,255,0.12);border-color:rgba(124,106,255,0.3);}
.pi-num{font-size:13px;color:var(--text3);min-width:22px;text-align:center;}
.pi-info{flex:1;min-width:0;}
.pi-name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pi-artist{font-size:12px;color:var(--text2);}
.pi-dur{font-size:12px;color:var(--text3);}
.playlist-item.active .pi-num{color:var(--accent);}
.playlist-item.active .pi-name{color:var(--accent2);}

/* Empty state */
#empty-state{
  text-align:center;padding:40px 20px;color:var(--text2);
}
#empty-state svg{margin-bottom:16px;opacity:0.3;}
#empty-state p{font-size:16px;line-height:1.6;}

/* Bars visualizer bottom */
#bars-bottom{
  position:fixed;bottom:0;left:0;right:0;height:56px;
  background:rgba(10,10,15,0.95);backdrop-filter:blur(12px);
  display:flex;align-items:flex-end;padding:4px 4px 0;
  border-top:1px solid var(--border);gap:2px;z-index:50;
}
.vbar{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:0.6;transition:height 0.1s;}

/* Admin button (hidden tap zone) */
#admin-trigger{
  position:fixed;bottom:0;right:0;width:56px;height:56px;
  background:none;border:none;cursor:pointer;z-index:100;opacity:0;
}

/* ========== ADMIN PAGE ========== */
#admin-wrap{
  min-height:100vh;
  background:var(--bg);
  display:flex;flex-direction:column;
}
#admin-header{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--border);
  background:var(--bg2);flex-shrink:0;
}
#admin-header h1{font-size:18px;font-weight:700;color:var(--text);flex:1;}
#btn-back-player{
  background:rgba(124,106,255,0.15);border:1px solid rgba(124,106,255,0.3);
  color:var(--accent2);border-radius:8px;padding:8px 14px;
  cursor:pointer;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:all 0.2s;
}
#btn-back-player:hover{background:rgba(124,106,255,0.25);}

/* Add Song Form */
#add-form-wrap{
  padding:20px;border-bottom:1px solid var(--border);
  background:var(--bg2);
}
#add-form-wrap h2{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:14px;letter-spacing:0.05em;text-transform:uppercase;}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.form-label{font-size:13px;color:var(--text2);}
.form-input{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;
  color:var(--text);font-size:15px;outline:none;
  transition:border-color 0.2s;
}
.form-input:focus{border-color:var(--accent);}
.form-input::placeholder{color:var(--text3);}
#btn-add-song{
  width:100%;padding:13px;
  background:var(--accent);border:none;border-radius:10px;
  color:white;font-size:16px;font-weight:700;
  cursor:pointer;transition:all 0.2s;margin-top:4px;
}
#btn-add-song:hover{background:var(--accent2);}
#btn-add-song:active{transform:scale(0.98);}

/* Admin song list */
#admin-list-wrap{flex:1;padding:20px;overflow-y:auto;}
#admin-list-wrap h2{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:14px;letter-spacing:0.05em;text-transform:uppercase;}
#admin-list{display:flex;flex-direction:column;gap:8px;}
.admin-item{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
.admin-item-num{
  width:30px;height:30px;border-radius:8px;
  background:rgba(124,106,255,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;
}
.admin-item-info{flex:1;min-width:0;}
.admin-item-name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:2px;}
.admin-item-artist{font-size:13px;color:var(--text2);}
.admin-item-url{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.admin-edit-btn{
  background:rgba(124,106,255,0.1);border:1px solid rgba(124,106,255,0.2);
  color:var(--accent);border-radius:8px;padding:6px 10px;
  cursor:pointer;font-size:12px;font-weight:600;flex-shrink:0;
  transition:all 0.2s;
}
.admin-edit-btn:hover{background:rgba(124,106,255,0.2);}
.admin-del-btn{
  background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.2);
  color:var(--red);border-radius:8px;padding:6px 10px;
  cursor:pointer;font-size:12px;font-weight:600;flex-shrink:0;
  transition:all 0.2s;
}
.admin-del-btn:hover{background:rgba(248,113,113,0.2);}

/* Edit modal overlay */
#edit-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;
  align-items:center;justify-content:center;padding:20px;
}
#edit-overlay.show{display:flex;}
#edit-modal{
  background:var(--bg2);border:1px solid var(--border);border-radius:16px;
  padding:24px;width:100%;max-width:400px;
}
#edit-modal h3{font-size:17px;font-weight:700;color:var(--text);margin-bottom:18px;}
.modal-btns{display:flex;gap:10px;margin-top:16px;}
.modal-btn-save{
  flex:1;padding:11px;background:var(--accent);border:none;
  border-radius:8px;color:white;font-size:15px;font-weight:700;cursor:pointer;
}
.modal-btn-cancel{
  padding:11px 18px;background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;color:var(--text2);font-size:15px;cursor:pointer;
}

/* Toast */
#toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--bg2);border:1px solid var(--accent);border-radius:10px;
  padding:10px 20px;font-size:14px;font-weight:600;color:var(--accent2);
  z-index:999;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  white-space:nowrap;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0);}

/* Admin badge */
#admin-count-badge{
  background:var(--accent);color:white;border-radius:20px;
  padding:2px 8px;font-size:12px;font-weight:700;
}
</style>

<script>
const KEY = 'nexus_songs_v2';
let songs = [];
let curIdx = -1;
let playing = false;
let shuffle = false;
let repeat = false;
let editIdx = -1;
let adminTaps = 0;
let adminTimer = null;
let audioCtx = null, analyser = null, srcNode = null;
let freqData = null;
let animId = null;
let barOffset = 0;

const audio = new Audio();
audio.crossOrigin = 'anonymous';
audio.volume = 0.8;

function load(){
  try{ songs = JSON.parse(localStorage.getItem(KEY))||[]; }
  catch(e){ songs=[]; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(songs)); }catch(e){} }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function fmt(s){
  if(!s||isNaN(s)) return '0:00';
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}

// ========== PLAYER ==========
function renderPlaylist(){
  const pl = document.getElementById('playlist');
  const em = document.getElementById('empty-state');
  pl.innerHTML='';
  if(!songs.length){ em.style.display='block'; return; }
  em.style.display='none';
  songs.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className='playlist-item'+(i===curIdx?' active':'');
    d.innerHTML=`
      <div class="pi-num">${i===curIdx&&playing?'♪':(i+1)}</div>
      <div class="pi-info">
        <div class="pi-name">${esc(s.name)}</div>
        <div class="pi-artist">${esc(s.artist||'')}</div>
      </div>
      <div class="pi-dur">${s.dur||''}</div>`;
    d.onclick=()=>playSong(i);
    pl.appendChild(d);
  });
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize=1024; analyser.smoothingTimeConstant=0.8;
  const src = audioCtx.createMediaElementSource(audio);
  src.connect(analyser); analyser.connect(audioCtx.destination);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  srcNode = src;
}

function drawAlbum(idx){
  const canvas = document.getElementById('album-canvas');
  const ctx = canvas.getContext('2d');
  const w=220,h=220,cx=110,cy=110;
  ctx.clearRect(0,0,w,h);
  const palettes=[
    ['#1a0033','#7c6aff','#c4b5fd'],
    ['#001a20','#06b6d4','#a5f3fc'],
    ['#200010','#ec4899','#fbcfe8'],
    ['#0f1a00','#84cc16','#d9f99d'],
    ['#1a1000','#f59e0b','#fde68a'],
    ['#001020','#3b82f6','#bfdbfe'],
  ];
  const p = palettes[idx % palettes.length];
  ctx.fillStyle=p[0]; ctx.fillRect(0,0,w,h);
  for(let r=100;r>15;r-=15){
    const g=ctx.createRadialGradient(cx,cy,r-15,cx,cy,r);
    g.addColorStop(0,'transparent'); g.addColorStop(1,p[1]);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=g; ctx.globalAlpha=0.12; ctx.fill();
  }
  ctx.globalAlpha=1;
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*95,cy+Math.sin(a)*95);
    ctx.strokeStyle=p[2]; ctx.globalAlpha=0.08; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='destination-in';
  ctx.beginPath(); ctx.arc(cx,cy,cx,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

function playSong(idx){
  if(idx<0||idx>=songs.length) return;
  curIdx=idx;
  const s=songs[idx];
  audio.src=s.url; audio.load();
  document.getElementById('song-title').textContent=s.name||'Không tên';
  document.getElementById('song-artist').textContent=s.artist||'';
  drawAlbum(idx);
  renderPlaylist();
  initAudio();
  if(audioCtx.state==='suspended') audioCtx.resume();
  audio.play().then(()=>{
    playing=true; updatePlayBtn();
    document.getElementById('album-art').classList.add('playing');
  }).catch(()=>{
    playing=false; updatePlayBtn();
  });
}

function updatePlayBtn(){
  const icon=document.getElementById('icon-play');
  icon.innerHTML = playing
    ? '<path d="M6 4h4v16H6zm8 0h4v16h-4z" fill="white"/>'
    : '<path d="M8 5v14l11-7-11-7Z" fill="white"/>';
}

audio.addEventListener('ended',()=>{
  if(repeat){ audio.currentTime=0; audio.play(); return; }
  if(songs.length<=1){ playing=false; updatePlayBtn(); document.getElementById('album-art').classList.remove('playing'); return; }
  const next = shuffle ? Math.floor(Math.random()*songs.length) : (curIdx+1)%songs.length;
  playSong(next);
});

audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return;
  const pct=audio.currentTime/audio.duration*100;
  document.getElementById('progress-bar-fill').style.width=pct+'%';
  document.getElementById('progress-input').value=pct;
  document.getElementById('time-cur').textContent=fmt(audio.currentTime);
  document.getElementById('time-total').textContent=fmt(audio.duration);
});

audio.addEventListener('loadedmetadata',()=>{
  if(curIdx>=0&&songs[curIdx]){
    songs[curIdx].dur=fmt(audio.duration);
    save(); renderPlaylist();
  }
});

audio.addEventListener('error',()=>{
  toast('Không tải được nhạc — kiểm tra link!');
  playing=false; updatePlayBtn();
  document.getElementById('album-art').classList.remove('playing');
});

document.getElementById('progress-input').addEventListener('input',e=>{
  if(audio.duration) audio.currentTime=(e.target.value/100)*audio.duration;
  document.getElementById('progress-bar-fill').style.width=e.target.value+'%';
});

document.getElementById('vol-slider').addEventListener('input',e=>{ audio.volume=e.target.value; });

document.getElementById('btn-play').addEventListener('click',()=>{
  if(!songs.length){ toast('Vào Admin để thêm nhạc trước!'); return; }
  if(curIdx<0) playSong(0);
  else if(playing){ audio.pause(); playing=false; document.getElementById('album-art').classList.remove('playing'); }
  else { initAudio(); if(audioCtx.state==='suspended') audioCtx.resume(); audio.play().then(()=>{ playing=true; document.getElementById('album-art').classList.add('playing'); }).catch(()=>{}); }
  updatePlayBtn();
});

document.getElementById('btn-next').addEventListener('click',()=>{
  if(!songs.length) return;
  const n = shuffle ? Math.floor(Math.random()*songs.length) : (curIdx+1)%songs.length;
  playSong(n);
});

document.getElementById('btn-prev').addEventListener('click',()=>{
  if(!songs.length) return;
  if(audio.currentTime>3){ audio.currentTime=0; return; }
  const p=(curIdx-1+songs.length)%songs.length;
  playSong(p);
});

document.getElementById('btn-shuffle').addEventListener('click',function(){
  shuffle=!shuffle; this.classList.toggle('active',shuffle);
  toast(shuffle?'Trộn bài: BẬT':'Trộn bài: TẮT');
});

document.getElementById('btn-repeat').addEventListener('click',function(){
  repeat=!repeat; this.classList.toggle('active',repeat);
  toast(repeat?'Lặp lại: BẬT':'Lặp lại: TẮT');
});

// Bars visualizer
const barsDiv = document.getElementById('bars-bottom');
const barCount = 48;
let bars = [];
for(let i=0;i<barCount;i++){
  const b=document.createElement('div'); b.className='vbar'; b.style.height='4px';
  barsDiv.appendChild(b); bars.push(b);
}

function animBars(){
  animId = requestAnimationFrame(animBars);
  barOffset+=0.03;
  if(freqData && analyser && playing){
    analyser.getByteFrequencyData(freqData);
    bars.forEach((b,i)=>{
      const v=freqData[Math.floor(i/barCount*freqData.length*.8)]/255;
      b.style.height=Math.max(3,v*44)+'px';
      b.style.opacity=(0.4+v*0.6).toString();
    });
  } else {
    bars.forEach((b,i)=>{
      const v=0.03+Math.sin(i*.18+barOffset)*.12;
      b.style.height=Math.max(3,v*44)+'px'; b.style.opacity='0.25';
    });
  }
}
animBars();

// Admin access: click 5 times on bottom-right
document.getElementById('admin-trigger').addEventListener('click',()=>{
  adminTaps++;
  clearTimeout(adminTimer);
  if(adminTaps>=5){ openAdmin(); adminTaps=0; return; }
  adminTimer=setTimeout(()=>adminTaps=0, 2000);
});

function openAdmin(){
  document.getElementById('page-player').classList.remove('active');
  document.getElementById('page-admin').classList.add('active');
  renderAdminList();
}

// ========== ADMIN ==========
function renderAdminList(){
  const list=document.getElementById('admin-list');
  const cnt=document.getElementById('admin-list-count');
  const badge=document.getElementById('admin-count-badge');
  cnt.textContent=songs.length; badge.textContent=songs.length;
  list.innerHTML='';
  if(!songs.length){
    list.innerHTML='<div style="text-align:center;padding:30px;color:var(--text3);font-size:15px;">Chưa có bài nào</div>';
    return;
  }
  songs.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='admin-item';
    d.innerHTML=`
      <div class="admin-item-num">${i+1}</div>
      <div class="admin-item-info">
        <div class="admin-item-name">${esc(s.name)}</div>
        <div class="admin-item-artist">${esc(s.artist||'Chưa có tên ca sĩ')}</div>
        <div class="admin-item-url">${esc(s.url)}</div>
      </div>
      <button class="admin-edit-btn" data-i="${i}">Sửa</button>
      <button class="admin-del-btn" data-i="${i}">Xóa</button>`;
    list.appendChild(d);
  });

  list.querySelectorAll('.admin-edit-btn').forEach(b=>{
    b.onclick=()=>openEdit(parseInt(b.dataset.i));
  });
  list.querySelectorAll('.admin-del-btn').forEach(b=>{
    b.onclick=()=>deleteSong(parseInt(b.dataset.i));
  });
}

document.getElementById('btn-add-song').addEventListener('click',()=>{
  const name=document.getElementById('inp-name').value.trim();
  const artist=document.getElementById('inp-artist').value.trim();
  const url=document.getElementById('inp-url').value.trim();
  if(!name){ toast('Nhập tên bài hát!'); document.getElementById('inp-name').focus(); return; }
  if(!url){ toast('Nhập link MP3!'); document.getElementById('inp-url').focus(); return; }
  songs.push({name,artist,url,dur:''});
  save(); renderAdminList(); renderPlaylist();
  document.getElementById('inp-name').value='';
  document.getElementById('inp-artist').value='';
  document.getElementById('inp-url').value='';
  toast('Đã thêm: '+name);
  // Load duration
  const tmp=new Audio(); tmp.crossOrigin='anonymous'; tmp.src=url;
  tmp.addEventListener('loadedmetadata',()=>{
    const idx=songs.findIndex(s=>s.url===url&&s.name===name);
    if(idx>=0){ songs[idx].dur=fmt(tmp.duration); save(); renderAdminList(); renderPlaylist(); }
  });
});

// Enter key support for form
['inp-name','inp-artist','inp-url'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown',e=>{
    if(e.key==='Enter') document.getElementById('btn-add-song').click();
  });
});

function deleteSong(i){
  const name=songs[i].name;
  songs.splice(i,1);
  if(curIdx>=songs.length) curIdx=songs.length-1;
  save(); renderAdminList(); renderPlaylist();
  toast('Đã xóa: '+name);
}

function openEdit(i){
  editIdx=i;
  const s=songs[i];
  document.getElementById('edit-name').value=s.name||'';
  document.getElementById('edit-artist').value=s.artist||'';
  document.getElementById('edit-url').value=s.url||'';
  document.getElementById('edit-overlay').classList.add('show');
}

document.getElementById('edit-cancel').onclick=()=>{
  document.getElementById('edit-overlay').classList.remove('show');
};

document.getElementById('edit-save').onclick=()=>{
  if(editIdx<0) return;
  songs[editIdx].name=document.getElementById('edit-name').value.trim()||songs[editIdx].name;
  songs[editIdx].artist=document.getElementById('edit-artist').value.trim();
  const newUrl=document.getElementById('edit-url').value.trim();
  if(newUrl) songs[editIdx].url=newUrl;
  save();
  if(curIdx===editIdx){
    document.getElementById('song-title').textContent=songs[editIdx].name;
    document.getElementById('song-artist').textContent=songs[editIdx].artist||'';
  }
  renderAdminList(); renderPlaylist();
  document.getElementById('edit-overlay').classList.remove('show');
  toast('Đã lưu thay đổi!');
};

document.getElementById('btn-back-player').addEventListener('click',()=>{
  document.getElementById('page-admin').classList.remove('active');
  document.getElementById('page-player').classList.add('active');
  renderPlaylist();
});

// INIT
load();
drawAlbum(0);
renderPlaylist();
document.getElementById('admin-count-badge').textContent=songs.length;
if(songs.length){ document.getElementById('song-title').textContent='Nhấn ▶ để nghe'; }
</script>
